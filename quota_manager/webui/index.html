<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="quota-token" content="__QUOTA_TOKEN__">
  <meta name="app-version" content="__APP_VERSION__">
  <title>Quota Grid</title>
  <link rel="icon" href="/assets/quota-grid-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="surface">
    <header class="header">
      <img class="brand-mark" src="/assets/quota-grid-mark.svg" width="32" height="32" alt="">
      <div class="heading">
        <h1>AI Quotas</h1>
        <p id="subtitle">Загрузка…</p>
      </div>
      <div class="sync-pill" id="sync-pill" title="Состояние синхронизации">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="sync-label">IDLE</span>
      </div>
    </header>

    <section class="cards" id="cards" aria-live="polite"></section>

    <section class="empty" id="empty" hidden>
      <img src="/assets/quota-grid-mark.svg" width="40" height="40" alt="">
      <h2 id="empty-title">Нет активных сессий</h2>
      <p id="empty-text">Авторизуйте Codex, Claude Code или ZCode и обновите данные.</p>
      <code id="empty-command">quota-manager doctor</code>
    </section>

    <noscript>
      <p class="noscript">Для работы интерфейса нужен JavaScript.</p>
    </noscript>

    <footer class="footer">
      <button class="action" id="refresh" type="button">
        <img src="/assets/refresh.svg" width="16" height="16" alt="">
        <span id="refresh-label">Обновить</span>
      </button>
      <button class="action" id="settings" type="button">
        <img src="/assets/gear.svg" width="16" height="16" alt="">
        <span>Настройки</span>
      </button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
